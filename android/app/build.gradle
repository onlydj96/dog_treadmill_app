plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 데모 앱(목업 서버)은 `flutter run -t lib/main_demo.dart`처럼 진입점만 바꿔 빌드한다.
// 그때는 패키지 이름·앱 이름을 바꿔 실제 앱과 한 기기에 따로 설치되게 한다.
def isDemoBuild = (project.findProperty("target") ?: "").toString().replace("\\", "/").endsWith("lib/main_demo.dart")

android {
    namespace = "com.example.dog_treadmill_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = isDemoBuild ? "com.example.dog_treadmill_app.demo" : "com.example.dog_treadmill_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // 홈 화면 앱 이름 (res/values*/strings.xml, 기기 언어를 따른다: 데모는 "PawFit 데모" / "PawFit Demo")
        manifestPlaceholders += [appLabel: isDemoBuild ? "@string/app_name_demo" : "@string/app_name"]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Android 15+ 16KB 페이지 기기 대응 (안 하면 "Android 앱 호환성" 경고가 뜬다).
// mobile_scanner 5.x가 가져오는 ML Kit 17.2.0(libbarhopper_v3.so)과 CameraX 1.3.x(libimage_processing_util_jni.so)는
// 네이티브 라이브러리가 4KB 정렬이라, 앱 빌드에서만 16KB 정렬 버전으로 올린다.
// mobile_scanner 6.0.7+는 ML Kit을 올렸지만 iOS 최소 버전이 15.5라서, 7.x는 Kotlin 2.x가 필요해서 쓰지 않는다.
dependencies {
    constraints {
        implementation("com.google.mlkit:barcode-scanning:17.3.0") {
            because "16KB 페이지 정렬된 libbarhopper_v3.so"
        }
        ["camera-core", "camera-camera2", "camera-lifecycle"].each { module ->
            implementation("androidx.camera:${module}:1.4.2") {
                because "16KB 페이지 정렬된 libimage_processing_util_jni.so"
            }
        }
    }
}
