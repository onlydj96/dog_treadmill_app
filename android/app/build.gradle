plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 데모 앱(목업 서버)은 `flutter run -t lib/main_demo.dart`처럼 진입점만 바꿔 빌드한다.
// 그때는 패키지 이름·앱 이름을 바꿔 실제 앱과 한 기기에 따로 설치되게 한다.
def isDemoBuild = (project.findProperty("target") ?: "").toString().replace("\\", "/").endsWith("lib/main_demo.dart")

android {
    namespace = "com.example.dog_treadmill_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = isDemoBuild ? "com.example.dog_treadmill_app.demo" : "com.example.dog_treadmill_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // 홈 화면 앱 이름 (res/values*/strings.xml, 기기 언어를 따른다: 데모는 "PawFit 데모" / "PawFit Demo")
        manifestPlaceholders += [appLabel: isDemoBuild ? "@string/app_name_demo" : "@string/app_name"]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
