name: dog_treadmill_app
description: "PawFit - 반려견 트레드밀 예약 및 AI 보행 분석 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^0.71.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.1.0
  image_picker: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.15.4
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 앱 내 브랜드 마크 (원본 로고는 assets/logo — 용량이 커서 번들에 넣지 않는다)
  assets:
    - assets/images/

  # 숫자·통계·브랜드 워드마크용 디스플레이 폰트 (SIL OFL 1.1, assets/fonts/OFL.txt)
  # 한글은 각 플랫폼 시스템 폰트를 사용한다.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
